; Native Altare Sandbox fallback. This is NOT a Docker container supervisor.
; Install the prepared release at /home/junta/app and configure MySQL first.
[unix_http_server]
file=/run/junta-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/home/junta/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/junta-supervisord.pid
childlogdir=/home/junta
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/junta-supervisor.sock

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/home/junta/php-fpm.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/home/junta/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:scheduler]
directory=/home/junta/app
command=/usr/bin/php artisan schedule:work --no-interaction
user=www-data
priority=30
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=75
stopasgroup=true
killasgroup=true
stdout_logfile=/home/junta/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:worker]
directory=/home/junta/app
command=/usr/bin/php artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=128 --max-time=3600 --no-interaction
user=www-data
priority=30
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=75
stopasgroup=true
killasgroup=true
stdout_logfile=/home/junta/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
