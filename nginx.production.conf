server {
    listen ${NGINX_PORT};
    server_name _;
    root ${APP_PUBLIC_PATH};
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/storage/.*\.(?:php[0-9]*|phtml|phar|html?|svg|js)$ {
        return 404;
    }

    location /build/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass ${PHP_FPM_UPSTREAM};
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }
}
