; Native demonstration only. Use a separate Sandbox and an empty demo MySQL DB.
[include]
files=/home/junta/app/supervisord.sandbox.conf

[program:mailpit]
command=/usr/local/bin/mailpit --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025 --database /home/junta/mailpit.db --max 0 --disable-version-check --smtp-disable-rdns --allowed-hosts localhost,127.0.0.1
priority=5
umask=0077
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stdout_logfile=/home/junta/mailpit.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
